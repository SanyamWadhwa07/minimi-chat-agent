name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: "22.13" # the oldest Node with built-in SQLite unflagged
          - os: ubuntu-latest
            node: "24"
          - os: macos-latest
            node: "24"
          - os: windows-latest
            node: "24"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Unit and integration tests (no keys, no network)
        run: npm test
      - name: npm run dev explains a missing .env instead of crashing
        shell: bash
        run: |
          set +e
          out=$(npm run dev 2>&1); code=$?
          echo "$out"
          [ $code -ne 0 ] && echo "$out" | grep -q "cp .env.example .env"
