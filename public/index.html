<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>minimi chat agent</title>
    <meta name="description" content="A chat agent that searches the web and remembers what you asked, and when." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&display=swap" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <!-- Icons, drawn once and reused with <use>. -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" /><path d="m16 16 4.5 4.5" /></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
      <symbol id="i-memory" viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="14.5" rx="3" /><path d="M8.5 3.5v4M15.5 3.5v4M4 10.5h16" /></symbol>
      <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6" /></symbol>
      <symbol id="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor" /></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5" /></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" /><path d="M12 7.5v5.5M12 16.5v.5" /></symbol>
      <symbol id="i-swap" viewBox="0 0 24 24"><path d="M5 9h13l-3.5-3.5M19 15H6l3.5 3.5" /></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6" /></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" /></symbol>
      <!-- The mark, drawn in theme colours so it shows on white and on black. favicon.svg is the same shape. -->
      <symbol id="mark" viewBox="0 0 64 64">
        <rect x="4" y="5" width="56" height="55" rx="15" style="fill: var(--ink)" />
        <rect x="11" y="21" width="42" height="32" rx="8" style="fill: var(--paper)" />
        <rect x="20" y="9" width="5" height="9" rx="2.5" style="fill: var(--paper)" />
        <rect x="39" y="9" width="5" height="9" rx="2.5" style="fill: var(--paper)" />
        <circle cx="40" cy="37" r="8" style="fill: var(--memory)" />
      </symbol>
      <symbol id="i-mini" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="2.5" /><rect x="11.5" y="11" width="7" height="6" rx="1.2" fill="currentColor" stroke="none" /></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="2.5" /><path d="M14 10H9v5M9 10l6.5 6.5" /></symbol>
    </svg>

    <header class="topbar">
      <a class="brand" href="/" aria-label="minimi chat agent, start page">
        <svg class="mark" width="26" height="26" aria-hidden="true"><use href="#mark" /></svg>
        <span class="brand-name">minimi</span>
        <span class="brand-sub">chat agent</span>
      </a>
      <p id="status" class="status" role="status"></p>
      <nav class="top-actions">
        <button id="mini-btn" class="btn ghost" type="button" title="Keep the chat in a small window on top of your other apps" hidden>
          <svg class="icon"><use href="#i-mini" /></svg><span class="label">Mini window</span>
        </button>
        <button id="history-btn" class="btn ghost" type="button" aria-expanded="false" aria-controls="drawer">
          <svg class="icon"><use href="#i-memory" /></svg><span class="label">Memory</span><span id="memory-count" class="count" hidden></span>
        </button>
        <button id="new-btn" class="btn ghost" type="button">
          <svg class="icon"><use href="#i-plus" /></svg><span class="label">New chat</span>
        </button>
      </nav>
    </header>

    <main id="log" class="log" aria-live="polite"></main>

    <section id="away" class="away" hidden>
      <svg class="mark" width="44" height="44" aria-hidden="true"><use href="#mark" /></svg>
      <h2>The chat is in the mini window</h2>
      <p>It stays on top of your other apps. Close it, or bring it back here.</p>
      <button id="back-btn" class="btn solid" type="button">Bring the chat back</button>
    </section>

    <template id="empty-tpl">
      <section class="welcome">
        <svg class="mark welcome-mark" width="56" height="56" aria-hidden="true"><use href="#mark" /></svg>
        <h1>Ask about anything that changes.</h1>
        <p>I check the web for current facts, and I remember what you asked and when, so you can come back and ask what has changed since.</p>
        <div class="suggestions">
          <button type="button" class="suggestion" data-kind="search">
            <span class="kind"><svg class="icon"><use href="#i-search" /></svg>Searches the web</span>
            <span class="prompt">What's the cheapest managed Postgres hosting for a side project?</span>
          </button>
          <button type="button" class="suggestion" data-kind="search">
            <span class="kind"><svg class="icon"><use href="#i-search" /></svg>Several searches at once</span>
            <span class="prompt">Shortlist 5 CRM tools for a 20-person sales team, with prices.</span>
          </button>
          <button type="button" class="suggestion" data-kind="memory">
            <span class="kind"><svg class="icon"><use href="#i-memory" /></svg>Uses memory</span>
            <span class="prompt">What did I ask you last Tuesday? Is your answer still correct today?</span>
          </button>
        </div>
        <div class="demo" hidden>
          <div class="demo-head">
            <div>
              <b>Try the memory with demo history</b>
              <p>Adds three conversations dated earlier, answered live, so the memory question above has something to find. About half a minute.</p>
            </div>
            <button type="button" class="btn solid demo-btn">Add demo history</button>
          </div>
          <ul class="steps demo-steps"></ul>
        </div>
      </section>
    </template>

    <div class="dock">
      <form id="composer" class="composer">
        <label class="sr-only" for="input">Message</label>
        <textarea id="input" rows="1" placeholder="Ask anything, or about something you asked before" autocomplete="off"></textarea>
        <button id="send" class="send" type="submit" aria-label="Send">
          <svg class="icon"><use href="#i-up" /></svg>
        </button>
      </form>
      <p class="hint">Enter to send, Shift+Enter for a new line. Answers cite their sources; check what matters.</p>
    </div>

    <div id="scrim" class="scrim" hidden></div>
    <aside id="drawer" class="drawer" aria-label="Memory" hidden>
      <div class="drawer-head">
        <div>
          <h2>Memory</h2>
          <p id="drawer-sub" class="drawer-sub"></p>
        </div>
        <button id="drawer-close" class="btn ghost square" type="button" aria-label="Close memory"><svg class="icon"><use href="#i-close" /></svg></button>
      </div>
      <input id="filter" class="filter" type="search" placeholder="Filter by words" aria-label="Filter memory by words" />
      <div id="history-list" class="days"></div>
    </aside>

    <script type="module" src="/app.js"></script>
  </body>
</html>
