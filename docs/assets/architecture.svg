<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How one turn works</title>
  <desc id="d">A question goes through recall in code, then up to three model steps with parallel web searches, then the completed answer is saved with its time and sources, which later questions recall.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#000"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#FF8133"/></marker>
  </defs>
  <rect width="1200" height="640" rx="24" fill="#FFFFFF"/>

  <!-- the question -->
  <rect x="40" y="32" width="610" height="50" rx="16" fill="#F2F2F2"/>
  <text x="62" y="63" font-size="16" fill="#000">“Last Tuesday I asked about Postgres hosting. Has pricing changed?”</text>
  <path d="M120 82V122" stroke="#000" stroke-width="1.6" fill="none" marker-end="url(#a)"/>

  <!-- 1 recall -->
  <rect x="40" y="128" width="340" height="392" rx="18" fill="#F7F7F7"/>
  <text x="64" y="166" font-size="21" font-weight="600" fill="#000">1  Recall</text>
  <text x="64" y="190" font-size="14" fill="#737373">code, about 50 ms, no model call</text>
  <rect x="64" y="214" width="58" height="66" rx="10" fill="#FFFFFF" stroke="#E3E3E3"/>
  <path d="M64 224a10 10 0 0 1 10-10h38a10 10 0 0 1 10 10v8H64z" fill="#FF8133"/>
  <text x="93" y="229" font-size="11" font-weight="600" text-anchor="middle" fill="#000">Tue</text>
  <text x="93" y="268" font-size="28" font-weight="600" text-anchor="middle" fill="#000">3</text>
  <text x="138" y="240" font-size="16" fill="#000">“last Tuesday”</text>
  <text x="138" y="264" font-size="16" fill="#000">= Tue 3 Nov</text>
  <text x="64" y="322" font-size="14" fill="#737373">Past turns, in this order:</text>
  <circle cx="72" cy="349" r="4" fill="#FF8133"/><text x="86" y="354" font-size="16" fill="#000">asked that day</text>
  <circle cx="72" cy="381" r="4" fill="#FF8133"/><text x="86" y="386" font-size="16" fill="#000">same topic (full-text search)</text>
  <circle cx="72" cy="413" r="4" fill="#FF8133"/><text x="86" y="418" font-size="16" fill="#000">everything else, one line each</text>
  <text x="64" y="458" font-size="14" fill="#737373">until a size budget is full, so a</text>
  <text x="64" y="478" font-size="14" fill="#737373">small memory is always seen whole</text>

  <path d="M380 324H426" stroke="#000" stroke-width="1.6" fill="none" marker-end="url(#a)"/>

  <!-- 2 answer -->
  <rect x="430" y="128" width="380" height="392" rx="18" fill="#F7F7F7"/>
  <text x="454" y="166" font-size="21" font-weight="600" fill="#000">2  Answer</text>
  <text x="454" y="190" font-size="14" fill="#737373">up to 3 model steps, streamed</text>
  <rect x="454" y="210" width="332" height="58" rx="12" fill="#FFFFFF" stroke="#E3E3E3"/>
  <text x="472" y="235" font-size="16" fill="#000">Fast model picks every search</text>
  <text x="472" y="256" font-size="13" fill="#737373">gemini-3.6-flash</text>
  <g stroke="#000" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M506 268V296"/><path d="M620 268V296"/><path d="M734 268V296"/>
  </g>
  <g font-size="14" text-anchor="middle">
    <rect x="454" y="300" width="104" height="66" rx="12" fill="#FFFFFF" stroke="#E3E3E3"/>
    <text x="506" y="328" fill="#000">web_search</text><text x="506" y="350" font-size="12" fill="#737373">Neon</text>
    <rect x="568" y="300" width="104" height="66" rx="12" fill="#FFFFFF" stroke="#E3E3E3"/>
    <text x="620" y="328" fill="#000">web_search</text><text x="620" y="350" font-size="12" fill="#737373">Supabase</text>
    <rect x="682" y="300" width="104" height="66" rx="12" fill="#FFFFFF" stroke="#E3E3E3"/>
    <text x="734" y="328" fill="#000">web_search</text><text x="734" y="350" font-size="12" fill="#737373">AWS RDS</text>
  </g>
  <text x="620" y="388" font-size="13" text-anchor="middle" fill="#737373">all at once; each checks the page now and pages since 3 Nov</text>
  <path d="M620 394V418" stroke="#000" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <rect x="454" y="422" width="332" height="58" rx="12" fill="#FFFFFF" stroke="#E3E3E3"/>
  <text x="472" y="447" font-size="16" fill="#000">Main model writes, citing [n]</text>
  <text x="472" y="468" font-size="13" fill="#737373">gemini-3.8-flash, or Groq if Gemini fails</text>

  <path d="M810 324H856" stroke="#000" stroke-width="1.6" fill="none" marker-end="url(#a)"/>

  <!-- 3 save -->
  <rect x="860" y="128" width="300" height="392" rx="18" fill="#F7F7F7"/>
  <text x="884" y="166" font-size="21" font-weight="600" fill="#000">3  Save</text>
  <text x="884" y="190" font-size="14" fill="#737373">only a completed answer</text>
  <path d="M900 226v86c0 12 50 22 110 22s110-10 110-22v-86" fill="#FFFFFF" stroke="#E3E3E3"/>
  <ellipse cx="1010" cy="226" rx="110" ry="22" fill="#FFFFFF" stroke="#E3E3E3"/>
  <text x="1010" y="276" font-size="17" font-weight="600" text-anchor="middle" fill="#000">Memory</text>
  <text x="1010" y="298" font-size="13" text-anchor="middle" fill="#737373">SQLite on your machine</text>
  <text x="884" y="372" font-size="14" fill="#737373">Each exchange keeps</text>
  <circle cx="892" cy="399" r="4" fill="#000"/><text x="906" y="404" font-size="16" fill="#000">question and answer</text>
  <circle cx="892" cy="431" r="4" fill="#FF8133"/><text x="906" y="436" font-size="16" fill="#000">when it was asked</text>
  <circle cx="892" cy="463" r="4" fill="#000"/><text x="906" y="468" font-size="16" fill="#000">the sources it cited</text>

  <!-- the loop that makes "is it still correct?" work -->
  <path d="M1010 520V580H210V526" stroke="#FF8133" stroke-width="2" fill="none" marker-end="url(#o)"/>
  <text x="610" y="606" font-size="15" text-anchor="middle" fill="#000">Ask about it later, and the answer is re-checked against the same items and sources.</text>
</svg>
